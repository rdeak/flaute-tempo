# Every push to main: unit tests, release lint, a signed bundle and APK. When
# fluteAssistant.versionName in gradle.properties has no v<name> tag yet, the same run also uploads
# the bundle to the Play internal testing track (Workload Identity Federation, no key file), then
# tags the commit and publishes a GitHub Release with the bundle, the APK and the R8 mapping file.
# So a release is: bump the version line, push to main. Design and the reasons for each step:
# docs/superpowers/specs/2026-10-23-release-workflow-design.md. Setup: docs/release/README.md.
#
# Three jobs, so "Re-run failed jobs" repeats only what failed: build -> play -> release. Only
# build sees the signing secrets; only play gets an identity token; only release can write.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

# One run at a time and none cancelled: two quick pushes must not race on the same tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.version.outputs.name }}
      code: ${{ steps.version.outputs.code }}
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          # gradle.properties is left out of the cache key on purpose: it holds the version name,
          # so the default key would go cold on every release. Dependencies live in the build
          # scripts and the version catalog; the wrapper distribution is cached by its own key.
          cache-dependency-path: |
            **/*.gradle*
            **/gradle-wrapper.properties
            gradle/*.versions.toml

      - name: Work out the version
        id: version
        run: tools/release.sh version | tee -a "$GITHUB_OUTPUT"

      - name: Install the upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.FLUTE_ASSISTANT_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Repository secret FLUTE_ASSISTANT_KEYSTORE_BASE64 is not set; run tools/release.sh secrets (docs/release/README.md)"
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "FLUTE_ASSISTANT_STORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Test, lint and build the signed release
        env:
          FLUTE_ASSISTANT_STORE_PASSWORD: ${{ secrets.FLUTE_ASSISTANT_STORE_PASSWORD }}
          FLUTE_ASSISTANT_KEY_ALIAS: ${{ secrets.FLUTE_ASSISTANT_KEY_ALIAS }}
          FLUTE_ASSISTANT_KEY_PASSWORD: ${{ secrets.FLUTE_ASSISTANT_KEY_PASSWORD }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: >
          ./gradlew testDebugUnitTest lintRelease bundleRelease assembleRelease
          -PfluteAssistant.versionCode="$VERSION_CODE"

      - name: Verify the upload signature
        run: >
          tools/release.sh verify
          app/build/outputs/apk/release/app-release.apk
          app/build/outputs/bundle/release/app-release.aab

      # Only release runs keep files: the later jobs need them, and the same files go public in
      # the GitHub Release anyway. A week is enough to re-run a failed play or release job.
      - name: Collect the outputs
        if: steps.version.outputs.release == 'true'
        env:
          NAME: ${{ steps.version.outputs.name }}
        run: |
          mkdir -p dist
          cp app/build/outputs/bundle/release/app-release.aab "dist/flute-assistant-$NAME.aab"
          cp app/build/outputs/apk/release/app-release.apk "dist/flute-assistant-$NAME.apk"
          cp app/build/outputs/mapping/release/mapping.txt "dist/flute-assistant-$NAME-mapping.txt"

      - name: Keep the outputs for the next jobs
        if: steps.version.outputs.release == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 7
          if-no-files-found: error

  # Play goes before the GitHub release on purpose: if Google refuses, no tag exists yet and
  # re-running this job just works. No checkout: no repository code runs next to the token.
  play:
    name: Upload to Play internal testing
    needs: build
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # the identity token Google trades for a short-lived access token
    steps:
      - name: Fetch the bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Authenticate to Google Cloud
        id: play-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PLAY_SERVICE_ACCOUNT }}

      # The bundle already carries the R8 mapping file (BUNDLE-METADATA/.../proguard.map), so
      # Play gets it from there.
      - name: Upload to Play internal testing
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJson: ${{ steps.play-auth.outputs.credentials_file_path }}
          packageName: hr.bertlab.fluteassistant
          releaseFiles: dist/flute-assistant-${{ needs.build.outputs.name }}.aab
          tracks: internal
          status: completed
          releaseName: ${{ needs.build.outputs.name }}

  # Its own job so a failure here re-runs only this, never the Play upload again (Play refuses
  # a version code it has already seen).
  release:
    name: Tag and publish the GitHub Release
    needs: [build, play]
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # the tag and the release
    steps:
      - name: Check out with history and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch the release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ needs.build.outputs.name }}
          CODE: ${{ needs.build.outputs.code }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          tools/release.sh notes "$NAME" "$CODE" > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "Flute Assistant $NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            dist/*
